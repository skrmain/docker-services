services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:3.10-management-alpine
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
        # volumes:
        #     - ./services/rabbitmq:/etc/rabbitmq/
        ports:
            - 5672:5672 # AMQP protocol port
            - 15672:15672 # HTTP management UI

    postgres:
        container_name: postgres
        image: postgres:alpine
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./docker-data/postgres_data:/var/lib/postgresql

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        ports:
            - 5050:80
        volumes:
            - ./docker-data/pgadmin_data:/var/lib/pgadmin

    mysql:
        image: mysql
        command: --default-authentication-plugin=mysql_native_password
        restart: always
        ports:
            - 3306:3306
        volumes:
            - ./docker-data/mysql_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    redis:
        image: redis:latest
        container_name: redis
        # restart: always
        command: ['redis-server', '--requirepass', '${REDIS_PASS}']
        ports:
            - 6379:6379
        # volumes:
        #     - ./docker-data/redis_data:/data

    mongo:
        image: mongo
        restart: always
        ports:
            - 27017:27017
        volumes:
            - ./docker-data/mongo_data:/data/db/
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    # For MongoDb Replica Set
    mdb1:
        image: mongo:5.0.3
        container_name: MongoDB-1
        restart: always
        ports:
            - 27017:27017
        volumes:
            - ./docker-data/mdb1:/data/db/
            - ./rs-init.sh:/scripts/rs-init.sh
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        links:
            - mdb2
            - mdb3
        entrypoint: ['/usr/bin/mongod', '--bind_ip_all', '--replSet', 'dbrs']
    mdb2:
        image: mongo:5.0.3
        container_name: MongoDB-2
        restart: always
        ports:
            - 27018:27017
        volumes:
            - ./docker-data/mdb2:/data/db/
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        entrypoint: ['/usr/bin/mongod', '--bind_ip_all', '--replSet', 'dbrs']
    mdb3:
        image: mongo:5.0.3
        container_name: MongoDB-3
        restart: always
        ports:
            - 27019:27017
        volumes:
            - ./docker-data/mdb3:/data/db/
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        entrypoint: ['/usr/bin/mongod', '--bind_ip_all', '--replSet', 'dbrs']

    dynamodb:
        container_name: dynamodb
        image: 'amazon/dynamodb-local:latest'
        command: '-jar DynamoDBLocal.jar -sharedDb -dbPath ./data'
        ports:
            - '8000:8000'
        volumes:
            - './docker-data/dynamodb_data:/home/dynamodb_data/data'
        working_dir: /home/dynamodb_data

    nginx:
        image: nginx:alpine
        volumes:
            - ./services/nginx/:/etc/nginx/conf.d/
        network_mode: 'host'
        # ports:
        #     - "8080:80"
