services:
    redis_insight:
        image: redis/redisinsight:latest
        container_name: redis_insight
        restart: unless-stopped
        ports:
            - "5540:5540"

        volumes:
            - redis_insight_data:/data

    redis:
        image: redis:latest
        container_name: redis
        # restart: always
        command: ["redis-server", "--requirepass", "${REDIS_PASS}"]
        ports:
            - 6379:6379
        # volumes:
        #     - redis_data:/data

volumes:
    redis_insight_data:
    redis_data:
