services:
    qdrant:
        container_name: qdrant
        image: qdrant/qdrant:latest
        restart: unless-stopped
        ports:
            - "6333:6333" # REST API and Web UI -- http://localhost:6333/dashboard
            - "6334:6334" #  gRPC API
        volumes:
            - qdrant_data:/qdrant/storage

volumes:
    qdrant_data:
